[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iaclab"
version = "1.0.0"
description = "Infraestrutura declarativa em YAML, gerada em arquivos de configuracao, com plano antes de qualquer escrita"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "iac",
    "infraestrutura",
    "declarativo",
    "rede",
    "automatizacao",
    "drift",
    "dry-run",
    "configuracao",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
# A unica dependencia de execucao e PyYAML, para ler o YAML declarativo.
# O resto e biblioteca padrao: o diff usa difflib e a geracao usa so f-strings
# e listas. Nao ha dependencia de rede, de SSH nem de SDK de equipamento -
# e o projeto nao fala com equipamento nenhum.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
iaclab = "iaclab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["iaclab"]

[tool.coverage.report]
show_missing = true
# O padrao do portfolio e 70%. O piso fica aqui para que uma regressao
# derrube o build em vez de passar despercebida.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise SystemExit",
    "if TYPE_CHECKING:",
]